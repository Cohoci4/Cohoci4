<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Endless Runner</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      display: block;
      border-radius: 12px;
      box-shadow: 0 0 40px rgba(0, 200, 255, 0.15);
    }
    #mode-select {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(10,10,26,0.95);
      z-index: 10;
    }
    #mode-select h1 {
      color: #00d2ff;
      font-size: 48px;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(0,210,255,0.5);
    }
    #mode-select p.sub {
      color: #aaa;
      font-size: 16px;
      margin-bottom: 40px;
    }
    #mode-select .btn {
      background: transparent;
      border: 2px solid #00d2ff;
      color: #00d2ff;
      font-size: 22px;
      padding: 14px 50px;
      margin: 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    #mode-select .btn:hover {
      background: #00d2ff;
      color: #0a0a1a;
    }
    #mode-select .btn2 {
      border-color: #7b2ff7;
      color: #7b2ff7;
    }
    #mode-select .btn2:hover {
      background: #7b2ff7;
      color: #fff;
    }
    #mode-select .hint {
      color: #666;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

<!-- Mode selection screen -->
<div id="mode-select">
  <h1>ENDLESS RUNNER</h1>
  <p class="sub">Choose your mode</p>
  <button class="btn" id="btn-1p">1 Player</button>
  <button class="btn btn2" id="btn-2p">2 Players</button>
  <p class="hint">1P: SPACE / Click &nbsp;&nbsp;|&nbsp;&nbsp; 2P: Player 1 — SPACE, Player 2 — W</p>
</div>

<canvas id="game"></canvas>

<script>
// ─── Canvas Setup ───
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width  = Math.min(window.innerWidth - 20, 960);
  canvas.height = Math.min(window.innerHeight - 20, 520);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ─── Constants ───
const GRAVITY         = 0.6;
const JUMP_FORCE      = -13;
const GROUND_OFFSET   = 60;
const BASE_SPEED      = 5;
const SPEED_INCREMENT = 0.0004;
const OBSTACLE_GAP    = 90;
const COIN_GAP        = 110;
const STAGE_DURATION  = 600; // frames per stage before possible biome change

// ─── Biome definitions (random stages) ───
const BIOMES = [
  {
    name: 'Neon City',
    sky1: '#0f0c29', sky2: '#302b63', sky3: '#24243e',
    ground: '#1a1a2e', groundLine: '#00d2ff',
    mountain: '#1a1a3e', mountainMid: '#252550', mountainFar: '#15152d',
    cloudColor: 'rgba(0,210,255,0.07)',
    gridColor: 'rgba(0,210,255,0.06)',
    obstacle: '#ff2e63', obstacleDark: '#b80040', obstacleTop: '#ff6b8a',
    accent: '#00d2ff'
  },
  {
    name: 'Sunset Desert',
    sky1: '#1a0a2e', sky2: '#4a1942', sky3: '#b55400',
    ground: '#2a1a0e', groundLine: '#ff8c00',
    mountain: '#3d1f0a', mountainMid: '#5a2f10', mountainFar: '#2a1508',
    cloudColor: 'rgba(255,140,0,0.08)',
    gridColor: 'rgba(255,140,0,0.05)',
    obstacle: '#ff4500', obstacleDark: '#a02d00', obstacleTop: '#ff7744',
    accent: '#ff8c00'
  },
  {
    name: 'Toxic Jungle',
    sky1: '#0a1a0a', sky2: '#0d2b0d', sky3: '#1a3a1a',
    ground: '#0e1e0e', groundLine: '#39ff14',
    mountain: '#0d2a0d', mountainMid: '#143814', mountainFar: '#091c09',
    cloudColor: 'rgba(57,255,20,0.06)',
    gridColor: 'rgba(57,255,20,0.05)',
    obstacle: '#ff1493', obstacleDark: '#a00060', obstacleTop: '#ff69b4',
    accent: '#39ff14'
  },
  {
    name: 'Frozen Tundra',
    sky1: '#0a1929', sky2: '#1a3a5c', sky3: '#2a5a8c',
    ground: '#1a2a3a', groundLine: '#88ddff',
    mountain: '#1a3050', mountainMid: '#254060', mountainFar: '#0f2035',
    cloudColor: 'rgba(136,221,255,0.08)',
    gridColor: 'rgba(136,221,255,0.05)',
    obstacle: '#00bfff', obstacleDark: '#0080aa', obstacleTop: '#66d9ff',
    accent: '#88ddff'
  },
  {
    name: 'Lava Core',
    sky1: '#1a0000', sky2: '#3a0a0a', sky3: '#5a1a00',
    ground: '#2a0a0a', groundLine: '#ff4400',
    mountain: '#3a0e0e', mountainMid: '#4a1515', mountainFar: '#200808',
    cloudColor: 'rgba(255,68,0,0.08)',
    gridColor: 'rgba(255,68,0,0.05)',
    obstacle: '#ffaa00', obstacleDark: '#b07000', obstacleTop: '#ffcc44',
    accent: '#ff4400'
  }
];

// ─── Player colors ───
const P1_COLOR = '#00d2ff';
const P1_GLOW  = 'rgba(0,210,255,0.4)';
const P2_COLOR = '#7b2ff7';
const P2_GLOW  = 'rgba(123,47,247,0.4)';

// ─── Game State ───
let twoPlayerMode = false;
let gameSpeed, frameCount, obstacles, coins, particles, stars;
let gameOver, started;
let currentBiome, nextBiomeAt, biomeTransition, prevBiome;
let lastObstacleFrame, lastCoinFrame;

// ─── Parallax layers ───
let bgLayers; // [{mountains: [{x,h,w}...], speed}]

function createPlayer(x, color, glow) {
  return { x, y: 0, w: 36, h: 36, vy: 0, grounded: true, rotation: 0,
           color, glow, score: 0, alive: true };
}

let player1, player2;

// ─── Stars ───
function generateStars() {
  stars = [];
  for (let i = 0; i < 80; i++) {
    stars.push({
      x: Math.random() * 960, y: Math.random() * 400,
      r: Math.random() * 1.5 + 0.3, twinkle: Math.random() * Math.PI * 2
    });
  }
}

// ─── Parallax mountain layers ───
function generateMountains() {
  bgLayers = [];
  // Far layer
  const far = [];
  for (let x = 0; x < 1200; x += 80 + Math.random() * 60) {
    far.push({ x, h: 60 + Math.random() * 50, w: 100 + Math.random() * 80 });
  }
  bgLayers.push({ mountains: far, speed: 0.3, yOff: 0 });
  // Mid layer
  const mid = [];
  for (let x = 0; x < 1200; x += 60 + Math.random() * 50) {
    mid.push({ x, h: 40 + Math.random() * 40, w: 70 + Math.random() * 60 });
  }
  bgLayers.push({ mountains: mid, speed: 0.7, yOff: 20 });
  // Near layer (buildings / tall shapes)
  const near = [];
  for (let x = 0; x < 1200; x += 40 + Math.random() * 40) {
    near.push({ x, h: 20 + Math.random() * 30, w: 30 + Math.random() * 30 });
  }
  bgLayers.push({ mountains: near, speed: 1.2, yOff: 35 });
}

// ─── Clouds (parallax) ───
let clouds = [];
function generateClouds() {
  clouds = [];
  for (let i = 0; i < 6; i++) {
    clouds.push({
      x: Math.random() * 1000,
      y: 30 + Math.random() * 120,
      w: 60 + Math.random() * 100,
      h: 15 + Math.random() * 20,
      speed: 0.15 + Math.random() * 0.3
    });
  }
}

// ─── Biome management ───
function pickRandomBiome(exclude) {
  let choices = BIOMES.filter(b => b !== exclude);
  return choices[Math.floor(Math.random() * choices.length)];
}

function lerpColor(a, b, t) {
  const ah = parseInt(a.slice(1), 16), bh = parseInt(b.slice(1), 16);
  const ar = (ah >> 16) & 0xff, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
  const br = (bh >> 16) & 0xff, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
  const rr = Math.round(ar + (br - ar) * t);
  const rg = Math.round(ag + (bg - ag) * t);
  const rb = Math.round(ab + (bb - ab) * t);
  return `#${((rr << 16) | (rg << 8) | rb).toString(16).padStart(6, '0')}`;
}

function getBiomeColor(key) {
  if (biomeTransition > 0 && prevBiome) {
    const t = 1 - biomeTransition / 60;
    return lerpColor(prevBiome[key], currentBiome[key], t);
  }
  return currentBiome[key];
}

// ─── Init / Reset ───
function init() {
  gameSpeed       = BASE_SPEED;
  frameCount      = 0;
  obstacles       = [];
  coins           = [];
  particles       = [];
  gameOver        = false;
  started         = false;
  lastObstacleFrame = -OBSTACLE_GAP;
  lastCoinFrame   = -COIN_GAP;
  currentBiome    = BIOMES[0];
  prevBiome       = null;
  biomeTransition = 0;
  nextBiomeAt     = STAGE_DURATION + Math.floor(Math.random() * 300);

  player1 = createPlayer(80, P1_COLOR, P1_GLOW);
  player1.y = groundY() - player1.h;
  player1.score = 0;

  if (twoPlayerMode) {
    player2 = createPlayer(45, P2_COLOR, P2_GLOW);
    player2.y = groundY() - player2.h;
    player2.score = 0;
  } else {
    player2 = null;
  }

  generateStars();
  generateMountains();
  generateClouds();
}

function groundY() { return canvas.height - GROUND_OFFSET; }

function getPlayers() {
  const arr = [player1];
  if (player2) arr.push(player2);
  return arr;
}

function allDead() {
  return getPlayers().every(p => !p.alive);
}

// ─── Input ───
function jumpPlayer(p) {
  if (!p || !p.alive) return;
  if (gameOver) { init(); return; }
  if (!started) started = true;
  if (p.grounded) {
    p.vy = JUMP_FORCE;
    p.grounded = false;
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); jumpPlayer(player1); }
  if (e.code === 'KeyW') { e.preventDefault(); jumpPlayer(player2); }
});
canvas.addEventListener('click', () => {
  if (!twoPlayerMode) jumpPlayer(player1);
});
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!twoPlayerMode) jumpPlayer(player1);
}, { passive: false });

// ─── Spawn helpers ───
function spawnObstacle() {
  if (frameCount - lastObstacleFrame < OBSTACLE_GAP) return;
  if (Math.random() > 0.025) return;
  const h = 30 + Math.random() * 45;
  const w = 22 + Math.random() * 18;
  obstacles.push({ x: canvas.width + 10, y: groundY() - h, w, h, scored: [] });
  lastObstacleFrame = frameCount;
}

function spawnCoin() {
  if (frameCount - lastCoinFrame < COIN_GAP) return;
  if (Math.random() > 0.018) return;
  coins.push({
    x: canvas.width + 10,
    y: groundY() - 70 - Math.random() * 80,
    r: 12, collected: false
  });
  lastCoinFrame = frameCount;
}

// ─── Particles ───
function emitParticles(x, y, count, color) {
  const colors = ['#00d2ff', '#ff2e63', '#ffd700', '#7b2ff7'];
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: (Math.random() - 1) * 5,
      r: Math.random() * 3 + 1,
      life: 30 + Math.random() * 20, maxLife: 50,
      color: color || colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

// ─── Collision ───
function collides(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function collidesCircle(p, coin) {
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  const dx = cx - coin.x, dy = cy - coin.y;
  return Math.sqrt(dx * dx + dy * dy) < p.w / 2 + coin.r;
}

// ─── Update ───
function update() {
  if (!started || gameOver) return;
  frameCount++;
  gameSpeed = BASE_SPEED + frameCount * SPEED_INCREMENT;

  // Biome transition
  if (biomeTransition > 0) biomeTransition--;
  if (frameCount >= nextBiomeAt) {
    prevBiome = currentBiome;
    currentBiome = pickRandomBiome(currentBiome);
    biomeTransition = 60;
    nextBiomeAt = frameCount + STAGE_DURATION + Math.floor(Math.random() * 400);
  }

  // Update each alive player
  for (const p of getPlayers()) {
    if (!p.alive) continue;
    p.vy += GRAVITY;
    p.y  += p.vy;
    if (p.y >= groundY() - p.h) {
      p.y = groundY() - p.h;
      p.vy = 0;
      p.grounded = true;
    }
    if (!p.grounded) p.rotation += 0.08;
    else p.rotation = 0;
  }

  // Obstacles
  spawnObstacle();
  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= gameSpeed;
    // Score for each player when obstacle passes them
    for (const p of getPlayers()) {
      if (p.alive && !o.scored.includes(p) && o.x + o.w < p.x) {
        o.scored.push(p);
        p.score++;
      }
    }
    if (o.x + o.w < -10) { obstacles.splice(i, 1); continue; }
    // Collision with each player
    for (const p of getPlayers()) {
      if (p.alive && collides(p, o)) {
        p.alive = false;
        emitParticles(p.x + p.w / 2, p.y + p.h / 2, 30, p.color);
      }
    }
  }
  if (allDead()) gameOver = true;

  // Coins
  spawnCoin();
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    c.x -= gameSpeed;
    if (c.x + c.r < -10) { coins.splice(i, 1); continue; }
    if (!c.collected) {
      for (const p of getPlayers()) {
        if (p.alive && collidesCircle(p, c)) {
          c.collected = true;
          p.score += 3;
          emitParticles(c.x, c.y, 12, '#ffd700');
          coins.splice(i, 1);
          break;
        }
      }
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Parallax update
  for (const layer of bgLayers) {
    for (const m of layer.mountains) {
      m.x -= gameSpeed * layer.speed;
      if (m.x + m.w < -20) m.x += 1200 + m.w;
    }
  }
  for (const c of clouds) {
    c.x -= gameSpeed * c.speed;
    if (c.x + c.w < -20) { c.x = canvas.width + 20 + Math.random() * 100; c.y = 30 + Math.random() * 120; }
  }
}

// ─── Drawing ───
function drawBackground() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, getBiomeColor('sky1'));
  grad.addColorStop(0.5, getBiomeColor('sky2'));
  grad.addColorStop(1, getBiomeColor('sky3'));
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars
  for (const s of stars) {
    s.twinkle += 0.02;
    const alpha = 0.4 + Math.sin(s.twinkle) * 0.3;
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x * (canvas.width / 960), s.y * (canvas.height / 520), s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Clouds (parallax)
  const cColor = currentBiome.cloudColor || 'rgba(255,255,255,0.06)';
  for (const c of clouds) {
    ctx.fillStyle = cColor;
    ctx.beginPath();
    ctx.ellipse(c.x + c.w / 2, c.y + c.h / 2, c.w / 2, c.h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x + c.w * 0.3, c.y + c.h * 0.3, c.w * 0.35, c.h * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x + c.w * 0.7, c.y + c.h * 0.4, c.w * 0.3, c.h * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawMountains() {
  const gY = groundY();
  const colorKeys = ['mountainFar', 'mountainMid', 'mountain'];
  for (let li = 0; li < bgLayers.length; li++) {
    const layer = bgLayers[li];
    const cKey = colorKeys[li] || 'mountain';
    ctx.fillStyle = getBiomeColor(cKey);
    for (const m of layer.mountains) {
      ctx.beginPath();
      ctx.moveTo(m.x, gY - layer.yOff);
      ctx.lineTo(m.x + m.w / 2, gY - layer.yOff - m.h);
      ctx.lineTo(m.x + m.w, gY - layer.yOff);
      ctx.closePath();
      ctx.fill();
    }
  }
}

function drawGrid() {
  ctx.strokeStyle = currentBiome.gridColor || 'rgba(0,210,255,0.06)';
  ctx.lineWidth = 1;
  const gridSize = 50;
  const offset = started ? (frameCount * gameSpeed) % gridSize : 0;
  for (let x = -offset; x < canvas.width; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, groundY()); ctx.stroke();
  }
  for (let y = 0; y < groundY(); y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
}

function drawGround() {
  ctx.fillStyle = getBiomeColor('ground');
  ctx.fillRect(0, groundY(), canvas.width, GROUND_OFFSET);
  const glColor = getBiomeColor('groundLine');
  ctx.strokeStyle = glColor;
  ctx.lineWidth = 2;
  ctx.shadowColor = glColor;
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(0, groundY());
  ctx.lineTo(canvas.width, groundY());
  ctx.stroke();
  ctx.shadowBlur = 0;
  // Ground dashes moving
  ctx.strokeStyle = glColor;
  ctx.lineWidth = 1;
  ctx.globalAlpha = 0.3;
  const dashOff = started ? (frameCount * gameSpeed * 1.5) % 30 : 0;
  for (let x = -dashOff; x < canvas.width; x += 30) {
    ctx.beginPath();
    ctx.moveTo(x, groundY() + 15);
    ctx.lineTo(x + 12, groundY() + 15);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function drawPlayerChar(p) {
  if (!p || !p.alive) return;
  ctx.save();
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  ctx.translate(cx, cy);
  ctx.rotate(p.rotation);

  ctx.shadowColor = p.glow;
  ctx.shadowBlur = 18;
  ctx.fillStyle = p.color;
  const r = 6, hw = p.w / 2, hh = p.h / 2;
  ctx.beginPath();
  ctx.moveTo(-hw + r, -hh);
  ctx.lineTo(hw - r, -hh);
  ctx.quadraticCurveTo(hw, -hh, hw, -hh + r);
  ctx.lineTo(hw, hh - r);
  ctx.quadraticCurveTo(hw, hh, hw - r, hh);
  ctx.lineTo(-hw + r, hh);
  ctx.quadraticCurveTo(-hw, hh, -hw, hh - r);
  ctx.lineTo(-hw, -hh + r);
  ctx.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(6, -4, 5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#0a0a1a';
  ctx.beginPath(); ctx.arc(7, -4, 2.5, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

// Ghost trail for dead players
function drawGhost(p) {
  if (!p || p.alive) return;
  ctx.save();
  ctx.globalAlpha = 0.25;
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  ctx.translate(cx, cy);
  ctx.fillStyle = p.color;
  const hw = p.w / 2, hh = p.h / 2;
  ctx.fillRect(-hw, -hh, p.w, p.h);
  ctx.restore();
  ctx.fillStyle = '#fff';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.globalAlpha = 0.4;
  ctx.fillText('X', p.x + p.w / 2, p.y + p.h / 2 + 4);
  ctx.globalAlpha = 1;
}

function drawObstacles() {
  for (const o of obstacles) {
    ctx.fillStyle = getBiomeColor('obstacleDark');
    ctx.fillRect(o.x + 3, o.y + 3, o.w, o.h);
    ctx.fillStyle = getBiomeColor('obstacle');
    ctx.shadowColor = getBiomeColor('obstacle');
    ctx.shadowBlur = 8;
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.shadowBlur = 0;
    ctx.fillStyle = getBiomeColor('obstacleTop');
    ctx.fillRect(o.x, o.y, o.w, 4);
  }
}

function drawCoins() {
  const bob = Math.sin(frameCount * 0.08) * 4;
  for (const c of coins) {
    if (c.collected) continue;
    ctx.save();
    ctx.translate(c.x, c.y + bob);
    ctx.shadowColor = 'rgba(255,215,0,0.35)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#b8960a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, c.r - 4, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#b8960a';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('$', 0, 1);
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  const accent = getBiomeColor('accent');
  ctx.textAlign = 'left';
  // Player 1 score
  ctx.fillStyle = P1_COLOR;
  ctx.font = 'bold 20px "Segoe UI", sans-serif';
  ctx.fillText(`P1: ${player1.score}`, 20, 32);
  if (!player1.alive) {
    ctx.fillStyle = '#ff2e63'; ctx.font = '12px sans-serif';
    ctx.fillText('DEAD', 20, 48);
  }
  // Player 2 score
  if (player2) {
    ctx.fillStyle = P2_COLOR;
    ctx.font = 'bold 20px "Segoe UI", sans-serif';
    ctx.fillText(`P2: ${player2.score}`, 120, 32);
    if (!player2.alive) {
      ctx.fillStyle = '#ff2e63'; ctx.font = '12px sans-serif';
      ctx.fillText('DEAD', 120, 48);
    }
  }
  // Speed & biome
  ctx.font = '13px "Segoe UI", sans-serif';
  ctx.fillStyle = accent;
  ctx.textAlign = 'right';
  ctx.fillText(`Speed: ${gameSpeed.toFixed(1)}`, canvas.width - 20, 28);
  ctx.fillStyle = '#888';
  ctx.font = '11px "Segoe UI", sans-serif';
  ctx.fillText(currentBiome.name, canvas.width - 20, 44);
}

function drawStartScreen() {
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#00d2ff';
  ctx.font = 'bold 36px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('READY?', canvas.width / 2, canvas.height / 2 - 20);
  ctx.fillStyle = '#fff';
  ctx.font = '18px "Segoe UI", sans-serif';
  if (twoPlayerMode) {
    ctx.fillText('P1: SPACE | P2: W', canvas.width / 2, canvas.height / 2 + 20);
  } else {
    ctx.fillText('Press SPACE or tap to start', canvas.width / 2, canvas.height / 2 + 20);
  }
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#ff2e63';
  ctx.font = 'bold 44px "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 50);

  ctx.font = '22px "Segoe UI", sans-serif';
  ctx.fillStyle = P1_COLOR;
  ctx.fillText(`P1 Score: ${player1.score}`, canvas.width / 2, canvas.height / 2 - 10);
  if (player2) {
    ctx.fillStyle = P2_COLOR;
    ctx.fillText(`P2 Score: ${player2.score}`, canvas.width / 2, canvas.height / 2 + 20);
    // Winner
    ctx.font = 'bold 18px "Segoe UI", sans-serif';
    if (player1.score > player2.score) {
      ctx.fillStyle = P1_COLOR;
      ctx.fillText('Player 1 Wins!', canvas.width / 2, canvas.height / 2 + 52);
    } else if (player2.score > player1.score) {
      ctx.fillStyle = P2_COLOR;
      ctx.fillText('Player 2 Wins!', canvas.width / 2, canvas.height / 2 + 52);
    } else {
      ctx.fillStyle = '#fff';
      ctx.fillText('Tie!', canvas.width / 2, canvas.height / 2 + 52);
    }
  }

  // Restart button
  const bw = 180, bh = 46;
  const bx = canvas.width / 2 - bw / 2;
  const by = player2 ? canvas.height / 2 + 70 : canvas.height / 2 + 40;
  ctx.fillStyle = getBiomeColor('accent');
  ctx.beginPath();
  ctx.moveTo(bx + 10, by);
  ctx.lineTo(bx + bw - 10, by);
  ctx.quadraticCurveTo(bx + bw, by, bx + bw, by + 10);
  ctx.lineTo(bx + bw, by + bh - 10);
  ctx.quadraticCurveTo(bx + bw, by + bh, bx + bw - 10, by + bh);
  ctx.lineTo(bx + 10, by + bh);
  ctx.quadraticCurveTo(bx, by + bh, bx, by + bh - 10);
  ctx.lineTo(bx, by + 10);
  ctx.quadraticCurveTo(bx, by, bx + 10, by);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#0a0a1a';
  ctx.font = 'bold 20px "Segoe UI", sans-serif';
  ctx.fillText('RESTART', canvas.width / 2, by + bh / 2 + 7);
}

// ─── Main Loop ───
function loop() {
  update();
  drawBackground();
  drawMountains();
  drawGrid();
  drawGround();
  drawObstacles();
  drawCoins();
  drawGhost(player1);
  drawGhost(player2);
  drawPlayerChar(player1);
  drawPlayerChar(player2);
  drawParticles();
  if (started && !gameOver) drawHUD();
  if (!started) drawStartScreen();
  if (gameOver) { drawHUD(); drawGameOver(); }
  requestAnimationFrame(loop);
}

// ─── Mode selection ───
const modeScreen = document.getElementById('mode-select');
document.getElementById('btn-1p').addEventListener('click', () => {
  twoPlayerMode = false;
  modeScreen.style.display = 'none';
  init();
  loop();
});
document.getElementById('btn-2p').addEventListener('click', () => {
  twoPlayerMode = true;
  modeScreen.style.display = 'none';
  init();
  loop();
});
</script>
</body>
