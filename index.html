<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cyber Rangers Arena</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: #03030a; color: #dffcff; font-family: Inter, Segoe UI, Arial, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; inset: 16px auto auto 16px; min-width: 280px; padding: 14px; border: 1px solid #16f7ff66; border-radius: 14px; background: linear-gradient(135deg, #061622cc, #160326bb); box-shadow: 0 0 28px #00eaff33; backdrop-filter: blur(8px); pointer-events: none; }
    #hud h1 { margin: 0 0 8px; color: #7cf9ff; font-size: 20px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 12px #00eaff; }
    .row { display: flex; justify-content: space-between; gap: 16px; margin: 4px 0; color: #f3f7ff; font-size: 14px; }
    .hint { margin-top: 10px; color: #b9a7ff; font-size: 12px; line-height: 1.35; }
    #hpWrap { height: 10px; margin: 8px 0; border: 1px solid #ffffff33; background: #320b1a; border-radius: 99px; overflow: hidden; }
    #hp { width: 100%; height: 100%; background: linear-gradient(90deg, #ff2bd6, #00f5ff); box-shadow: 0 0 18px #00f5ff; transition: width .12s; }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 26px; height: 26px; transform: translate(-50%, -50%); border: 2px solid #00f5ff; border-radius: 50%; box-shadow: 0 0 18px #00f5ff; pointer-events: none; }
    #crosshair::before, #crosshair::after { content: ""; position: absolute; background: #ff2bd6; box-shadow: 0 0 10px #ff2bd6; }
    #crosshair::before { left: 11px; top: -8px; width: 2px; height: 40px; }
    #crosshair::after { top: 11px; left: -8px; width: 40px; height: 2px; }
    #shop { position: fixed; right: 18px; top: 18px; width: min(380px, calc(100vw - 36px)); max-height: calc(100vh - 36px); overflow: auto; padding: 18px; border: 1px solid #ff2bd688; border-radius: 18px; background: #070616e8; box-shadow: 0 0 34px #ff2bd633; backdrop-filter: blur(12px); display: none; }
    #shop.open { display: block; }
    #shop h2 { margin: 0 0 6px; color: #ff8af0; text-transform: uppercase; letter-spacing: 2px; }
    #shop p { margin: 0 0 12px; color: #aeeeff; font-size: 13px; }
    .item { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; padding: 12px; margin: 10px 0; border: 1px solid #ffffff1c; border-radius: 12px; background: linear-gradient(135deg, #101436, #24092b); }
    .item b { color: #fff; }
    .item small { color: #b7c8ff; }
    button { border: 1px solid #00f5ff; border-radius: 10px; padding: 9px 12px; color: #021219; background: #00f5ff; cursor: pointer; font-weight: 800; box-shadow: 0 0 14px #00f5ff55; }
    button:hover { filter: brightness(1.15); }
    #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 10px 16px; border-radius: 999px; background: #02040ee8; border: 1px solid #00f5ff66; color: #fff; opacity: 0; transition: opacity .2s; pointer-events: none; }
    #toast.show { opacity: 1; }
    #respawn { position: fixed; inset: 0; display: none; place-items: center; color: #ff8af0; font-size: clamp(28px, 5vw, 64px); font-weight: 900; text-transform: uppercase; letter-spacing: 4px; text-shadow: 0 0 20px #ff2bd6; pointer-events: none; background: radial-gradient(circle, #21061b88, #00000033 55%, #00000000); }
    #respawn.show { display: grid; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>Cyber Rangers</h1>
    <div class="row"><span>ID</span><b id="pid">...</b></div>
    <div id="hpWrap"><div id="hp"></div></div>
    <div class="row"><span>HP</span><b id="hpText">100</b></div>
    <div class="row"><span>Оружие</span><b id="weapon">Blaster</b></div>
    <div class="row"><span>Кредиты</span><b id="credits">0</b></div>
    <div class="row"><span>Очки</span><b id="score">0</b></div>
    <div class="row"><span>Игроки</span><b id="players">0</b></div>
    <div class="hint">WASD/стрелки — полёт, Space/Shift — высота, мышь — прицел, клик — выстрел, B — магазин.</div>
  </div>
  <div id="crosshair"></div>
  <section id="shop"><h2>Black Neon Shop</h2><p>Убийство даёт +100 кредитов. Покупка сразу экипирует предмет.</p><div id="shopItems"></div></section>
  <div id="toast"></div>
  <div id="respawn">Respawn...</div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
  </script>
  <script src="/socket.io/socket.io.js"></script>
  <script type="module">
    import * as THREE from "three";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    // ===================== Domain (Entities) =====================
    class Weapon { constructor(data) { Object.assign(this, data); } }
    class Projectile { constructor(data) { Object.assign(this, data); } }
    class Skin { constructor(data) { Object.assign(this, data); } }
    class ShopItem { constructor(data) { Object.assign(this, data); } }
    class Player {
      constructor(data) {
        this.id = data.id;
        this.name = data.name;
        this.position = data.position || { x: 0, y: 0, z: 0 };
        this.aim = data.aim || { x: 0, y: 0, z: -1 };
        this.yaw = data.yaw || 0;
        this.hp = data.hp ?? 100;
        this.alive = data.alive ?? true;
        this.weaponId = data.weaponId || "blaster";
        this.skinId = data.skinId || "neon";
        this.credits = data.credits || 0;
        this.score = data.score || 0;
        this.respawnIn = data.respawnIn || 0;
      }
    }

    // ===================== Use Cases (Application) =====================
    function normalize3(v) {
      const len = Math.hypot(v.x || 0, v.y || 0, v.z || 0);
      return len ? { x: (v.x || 0) / len, y: (v.y || 0) / len, z: (v.z || 0) / len } : { x: 0, y: 0, z: 0 };
    }

    function aimFromAngles(yaw, pitch) {
      const flat = Math.cos(pitch);
      return normalize3({ x: Math.sin(yaw) * flat, y: Math.sin(pitch), z: Math.cos(yaw) * flat });
    }

    function movePlayer(keys, yaw) {
      const forward = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0);
      const strafe = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
      const vertical = (keys.Space ? 1 : 0) - (keys.ShiftLeft || keys.ShiftRight ? 1 : 0);
      const f = { x: Math.sin(yaw), z: Math.cos(yaw) };
      const r = { x: Math.cos(yaw), z: -Math.sin(yaw) };
      return normalize3({ x: f.x * forward + r.x * strafe, y: vertical, z: f.z * forward + r.z * strafe });
    }

    function shoot(dir) { return { dir: normalize3(dir) }; }
    function applyDamage(player, damage) { return new Player({ ...player, hp: Math.max(0, player.hp - damage) }); }
    function purchaseItem(itemId) { return itemId; }
    function respawn(player, position) { return new Player({ ...player, position, hp: 100, alive: true, respawnIn: 0 }); }

    // ===================== Interface Adapters =====================
    class GameRepository {
      constructor() {
        this.selfId = null;
        this.players = new Map();
        this.weapons = new Map();
        this.skins = new Map();
        this.shop = [];
        this.playerCount = 0;
      }

      configure({ id, weapons, skins, shop }) {
        this.selfId = id;
        this.weapons = new Map(Object.values(weapons).map((weapon) => [weapon.id, new Weapon(weapon)]));
        this.skins = new Map(Object.values(skins).map((skin) => [skin.id, new Skin(skin)]));
        this.shop = shop.map((item) => new ShopItem(item));
      }

      update(snapshot) {
        this.playerCount = snapshot.playerCount || 0;
        const seen = new Set();
        for (const data of snapshot.players || []) {
          seen.add(data.id);
          this.players.set(data.id, new Player(data));
        }
        for (const id of this.players.keys()) if (!seen.has(id)) this.players.delete(id);
      }

      self() { return this.players.get(this.selfId); }
    }

    class NetworkAdapter {
      constructor(repository) {
        this.repository = repository;
        this.socket = io();
        this.snapshotHandlers = [];
        this.shotHandlers = [];
        this.socket.on("welcome", (payload) => {
          this.repository.configure(payload);
          renderShop();
          updateHud();
        });
        this.socket.on("snapshot", (snapshot) => {
          this.repository.update(snapshot);
          this.snapshotHandlers.forEach((handler) => handler(snapshot));
          updateHud();
        });
        this.socket.on("shot", (event) => this.shotHandlers.forEach((handler) => handler(event)));
        this.socket.on("purchaseResult", (result) => toast(result.message || (result.ok ? "Куплено" : "Ошибка")));
        this.socket.on("connect_error", () => toast("Нет соединения с сервером"));
      }

      onSnapshot(handler) { this.snapshotHandlers.push(handler); }
      onShot(handler) { this.shotHandlers.push(handler); }
      sendInput(move, aim, yaw) { this.socket.emit("input", { move, aim, yaw }); }
      fire(dir) { this.socket.emit("shoot", shoot(dir)); }
      buy(itemId) { this.socket.emit("buy", purchaseItem(itemId)); }
    }

    class RendererAdapter {
      constructor(repository) {
        this.repository = repository;
        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color("#03030a");
        this.scene.fog = new THREE.FogExp2("#050314", 0.012);
        this.camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 600);
        this.renderer = new THREE.WebGLRenderer({ antialias: true });
        this.renderer.setSize(innerWidth, innerHeight);
        this.renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
        this.renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(this.renderer.domElement);
        this.composer = new EffectComposer(this.renderer);
        this.composer.addPass(new RenderPass(this.scene, this.camera));
        this.composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.55, 0.08));
        this.meshes = new Map();
        this.effects = [];
        this.clock = new THREE.Clock();
        this.cameraPos = new THREE.Vector3(0, 35, -35);
        this.setupLights();
        this.generateCity();
      }

      setupLights() {
        this.scene.add(new THREE.HemisphereLight(0x44ccff, 0x090010, 1.2));
        const sun = new THREE.DirectionalLight(0xffffff, 1.6);
        sun.position.set(40, 80, 20);
        this.scene.add(sun);
        const grid = new THREE.GridHelper(260, 40, 0xff2bd6, 0x143060);
        grid.position.y = -18;
        this.scene.add(grid);
      }

      generateCity() {
        const dark = new THREE.MeshStandardMaterial({ color: 0x090b18, metalness: .55, roughness: .35, emissive: 0x050510 });
        const neon = [0x00f5ff, 0xff2bd6, 0xa6ff00, 0x7d5cff];
        for (let x = -110; x <= 110; x += 16) {
          for (let z = -110; z <= 110; z += 16) {
            if (Math.random() < .22) continue;
            const h = 12 + Math.random() * 34;
            const w = 7 + Math.random() * 7;
            const building = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), dark);
            building.position.set(x + Math.random() * 5, -18 + h / 2, z + Math.random() * 5);
            this.scene.add(building);
            const edge = new THREE.LineSegments(new THREE.EdgesGeometry(building.geometry), new THREE.LineBasicMaterial({ color: neon[Math.abs(x + z + 999) % neon.length] }));
            edge.position.copy(building.position);
            this.scene.add(edge);
            for (let i = 0; i < 3; i++) {
              const strip = new THREE.Mesh(new THREE.BoxGeometry(w + .08, .16, .08), new THREE.MeshBasicMaterial({ color: neon[Math.abs(i + x + 99) % neon.length] }));
              strip.position.set(building.position.x, -14 + i * 7 + Math.random() * 3, building.position.z + w / 2 + .06);
              this.scene.add(strip);
            }
          }
        }
      }

      makeLabel(text) {
        const canvas = document.createElement("canvas");
        canvas.width = 256; canvas.height = 64;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#021018cc"; ctx.fillRect(0, 0, 256, 64);
        ctx.strokeStyle = "#00f5ff"; ctx.strokeRect(2, 2, 252, 60);
        ctx.fillStyle = "#ffffff"; ctx.font = "bold 26px monospace"; ctx.textAlign = "center";
        ctx.fillText(text, 128, 40);
        const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
        sprite.scale.set(12, 3, 1);
        return sprite;
      }

      makeRanger(player) {
        const skin = this.repository.skins.get(player.skinId);
        const colors = skin?.colors || { hull: "#00f5ff", wing: "#ff00ff", glow: "#a6ff00" };
        const group = new THREE.Group();
        const hull = new THREE.Mesh(new THREE.CapsuleGeometry(1.25, 3.2, 8, 16), new THREE.MeshStandardMaterial({ color: colors.hull, metalness: .75, roughness: .24, emissive: colors.hull, emissiveIntensity: .18 }));
        hull.rotation.x = Math.PI / 2;
        group.add(hull);
        const cabin = new THREE.Mesh(new THREE.SphereGeometry(.82, 16, 10), new THREE.MeshBasicMaterial({ color: colors.glow }));
        cabin.position.set(0, .55, .45);
        group.add(cabin);
        const wingMaterial = new THREE.MeshStandardMaterial({ color: colors.wing, emissive: colors.wing, emissiveIntensity: .25, metalness: .5, roughness: .3 });
        const leftWing = new THREE.Mesh(new THREE.BoxGeometry(4.5, .18, 1.1), wingMaterial);
        const rightWing = leftWing.clone();
        leftWing.position.set(-2.5, -.1, -.35); rightWing.position.set(2.5, -.1, -.35);
        group.add(leftWing, rightWing);
        const hpBack = new THREE.Mesh(new THREE.PlaneGeometry(7, .55), new THREE.MeshBasicMaterial({ color: 0x330015, side: THREE.DoubleSide }));
        const hpBar = new THREE.Mesh(new THREE.PlaneGeometry(6.8, .35), new THREE.MeshBasicMaterial({ color: 0x00f5ff, side: THREE.DoubleSide }));
        hpBack.position.set(0, 4.1, 0); hpBar.position.set(0, 4.12, .03);
        group.add(hpBack, hpBar);
        const label = this.makeLabel(player.name);
        label.position.set(0, 5.9, 0);
        group.add(label);
        group.userData = { hpBar, skinId: player.skinId };
        return group;
      }

      sync() {
        const visibleIds = new Set();
        for (const player of this.repository.players.values()) {
          visibleIds.add(player.id);
          let mesh = this.meshes.get(player.id);
          if (!mesh || mesh.userData.skinId !== player.skinId) {
            if (mesh) this.scene.remove(mesh);
            mesh = this.makeRanger(player);
            this.meshes.set(player.id, mesh);
            this.scene.add(mesh);
          }
          mesh.visible = player.alive;
          mesh.position.set(player.position.x, player.position.y, player.position.z);
          mesh.rotation.y = player.yaw;
          mesh.userData.hpBar.scale.x = Math.max(.02, player.hp / 100);
          mesh.userData.hpBar.position.x = -3.4 * (1 - player.hp / 100);
          mesh.children.forEach((child) => { if (child.isSprite) child.quaternion.copy(this.camera.quaternion); });
        }
        for (const [id, mesh] of this.meshes) {
          if (!visibleIds.has(id)) {
            this.scene.remove(mesh);
            this.meshes.delete(id);
          }
        }
      }

      addShot(event) {
        const p = new Projectile(event.projectile);
        const weapon = this.repository.weapons.get(p.weaponId);
        const color = p.weaponId === "rocket" ? 0xff7a00 : p.weaponId === "plasma" ? 0xff2bd6 : 0x00f5ff;
        const geometry = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(p.from.x, p.from.y, p.from.z), new THREE.Vector3(p.to.x, p.to.y, p.to.z)]);
        const line = new THREE.Line(geometry, new THREE.LineBasicMaterial({ color, transparent: true, opacity: 1 }));
        this.scene.add(line);
        this.effects.push({ object: line, ttl: .18 });
        if (weapon?.explosionRadius) {
          const sphere = new THREE.Mesh(new THREE.SphereGeometry(weapon.explosionRadius, 24, 12), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: .35, wireframe: true }));
          sphere.position.set(p.to.x, p.to.y, p.to.z);
          this.scene.add(sphere);
          this.effects.push({ object: sphere, ttl: .35, grow: true });
        }
      }

      updateEffects(dt) {
        this.effects = this.effects.filter((effect) => {
          effect.ttl -= dt;
          effect.object.material.opacity = Math.max(0, effect.ttl * 4);
          if (effect.grow) effect.object.scale.multiplyScalar(1 + dt * 4);
          if (effect.ttl > 0) return true;
          this.scene.remove(effect.object);
          return false;
        });
      }

      updateCamera(aim) {
        const self = this.repository.self();
        if (!self) return;
        const pos = new THREE.Vector3(self.position.x, self.position.y, self.position.z);
        const back = new THREE.Vector3(-Math.sin(self.yaw) * 22, 10, -Math.cos(self.yaw) * 22);
        this.cameraPos.lerp(pos.clone().add(back), .08);
        this.camera.position.copy(this.cameraPos);
        this.camera.lookAt(pos.clone().add(new THREE.Vector3(aim.x * 22, aim.y * 22, aim.z * 22)));
      }

      animate(getAim) {
        const frame = () => {
          const dt = this.clock.getDelta();
          this.sync();
          this.updateEffects(dt);
          this.updateCamera(getAim());
          this.composer.render();
          requestAnimationFrame(frame);
        };
        frame();
      }

      resize() {
        this.camera.aspect = innerWidth / innerHeight;
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(innerWidth, innerHeight);
        this.composer.setSize(innerWidth, innerHeight);
      }
    }

    // ===================== Frameworks & Drivers =====================
    const $ = (id) => document.getElementById(id);
    const repository = new GameRepository();
    const network = new NetworkAdapter(repository);
    const renderer = new RendererAdapter(repository);
    const keys = {};
    let yaw = Math.PI;
    let pitch = 0;
    let shopOpen = false;

    function toast(message) {
      $("toast").textContent = message;
      $("toast").classList.add("show");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => $("toast").classList.remove("show"), 1700);
    }

    function updateHud() {
      const self = repository.self();
      $("players").textContent = repository.playerCount;
      if (!self) return;
      $("pid").textContent = self.name;
      $("hp").style.width = `${self.hp}%`;
      $("hpText").textContent = Math.round(self.hp);
      $("weapon").textContent = repository.weapons.get(self.weaponId)?.name || self.weaponId;
      $("credits").textContent = self.credits;
      $("score").textContent = self.score;
      $("respawn").classList.toggle("show", !self.alive);
      if (!self.alive) $("respawn").textContent = `Respawn ${Math.ceil(self.respawnIn / 1000)}...`;
    }

    function renderShop() {
      $("shopItems").innerHTML = "";
      for (const item of repository.shop) {
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `<div><b>${item.name}</b><br><small>${item.type.toUpperCase()} · ${item.price} credits</small></div>`;
        const button = document.createElement("button");
        button.textContent = item.price ? "BUY" : "EQUIP";
        button.onclick = () => network.buy(item.id);
        div.appendChild(button);
        $("shopItems").appendChild(div);
      }
    }

    addEventListener("keydown", (event) => {
      keys[event.code] = true;
      if (event.code === "KeyB") {
        shopOpen = !shopOpen;
        $("shop").classList.toggle("open", shopOpen);
      }
    });
    addEventListener("keyup", (event) => { keys[event.code] = false; });
    addEventListener("mousemove", (event) => {
      if (document.pointerLockElement !== document.body) return;
      yaw -= event.movementX * .0025;
      pitch = Math.max(-1.05, Math.min(1.05, pitch - event.movementY * .0022));
    });
    addEventListener("mousedown", () => {
      if (shopOpen) return;
      if (document.pointerLockElement !== document.body) document.body.requestPointerLock();
      network.fire(aimFromAngles(yaw, pitch));
    });
    addEventListener("resize", () => renderer.resize());
    network.onSnapshot(() => updateHud());
    network.onShot((event) => renderer.addShot(event));

    setInterval(() => {
      const aim = aimFromAngles(yaw, pitch);
      network.sendInput(movePlayer(keys, yaw), aim, yaw);
    }, 1000 / 30);

    renderer.animate(() => aimFromAngles(yaw, pitch));
  </script>
</body>
</html>
