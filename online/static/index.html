<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Neon Runner Online</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#050510;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;user-select:none;font-family:'Segoe UI',sans-serif;color:#fff}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{display:none;border-radius:8px}
.screen{display:none;flex-direction:column;align-items:center;text-align:center;padding:16px;max-width:420px;width:100%}
.screen.active{display:flex}
h1{font-size:36px;margin-bottom:4px;background:linear-gradient(90deg,#00d2ff,#7b2ff7,#ff2e63);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none}
h2{color:#00d2ff;font-size:24px;margin-bottom:8px;text-shadow:0 0 10px rgba(0,210,255,.3)}
.sub{color:#666;font-size:13px;margin-bottom:16px}
input{background:#0a0a2e;border:1px solid #1a1a4e;color:#fff;padding:10px 14px;margin:4px 0;
  border-radius:6px;font-size:15px;width:100%;outline:none;font-family:inherit}
input:focus{border-color:#00d2ff;box-shadow:0 0 8px rgba(0,210,255,.2)}
.btn{background:transparent;border:1px solid #00d2ff;color:#00d2ff;padding:10px 28px;margin:5px 3px;
  border-radius:6px;font-size:15px;cursor:pointer;transition:all .2s;font-family:inherit;min-width:100px}
.btn:hover,.btn:active{background:#00d2ff;color:#050510}
.btn.purple{border-color:#7b2ff7;color:#7b2ff7}.btn.purple:hover{background:#7b2ff7;color:#fff}
.btn.red{border-color:#ff2e63;color:#ff2e63}.btn.red:hover{background:#ff2e63;color:#fff}
.btn.green{border-color:#39ff14;color:#39ff14}.btn.green:hover{background:#39ff14;color:#050510}
.btn.sm{padding:6px 14px;font-size:12px;min-width:auto}
.btn.wide{width:100%;margin:5px 0}
.error{color:#ff2e63;font-size:12px;margin:4px 0;min-height:16px}
.row{display:flex;gap:6px;width:100%;justify-content:center;flex-wrap:wrap}
.room-list{width:100%;max-height:200px;overflow-y:auto;margin:8px 0}
.room-item{background:#0a0a2e;border:1px solid #1a1a4e;border-radius:6px;padding:8px 12px;margin:4px 0;
  display:flex;justify-content:space-between;align-items:center;font-size:13px}
.room-item .rid{color:#00d2ff;font-weight:bold}
.badge{display:inline-block;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:bold;
  background:#39ff14;color:#000;margin-left:6px}
.sep{height:1px;background:linear-gradient(90deg,transparent,#1a1a4e,transparent);width:100%;margin:10px 0}
.settings-group{width:100%;text-align:left;margin:6px 0}
.settings-group label{display:block;color:#888;font-size:12px;margin:6px 0 2px}
.settings-group select{width:100%;background:#0a0a2e;color:#fff;border:1px solid #1a1a4e;
  border-radius:4px;padding:6px;font-size:13px;font-family:inherit}
.controls-hint{background:#0a0a2e;border-radius:6px;padding:10px;margin:6px 0;width:100%;
  text-align:left;font-size:12px;color:#666;line-height:1.5}
.controls-hint b{color:#aaa}
.neon-title{font-size:40px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(135deg,#00d2ff,#7b2ff7,#ff2e63,#ffd700);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(0,210,255,.3));margin-bottom:6px}
.neon-glow{text-shadow:0 0 10px rgba(0,210,255,.4),0 0 20px rgba(123,47,247,.2)}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#0a0a2e;
  border:1px solid #00d2ff;color:#fff;padding:6px 16px;border-radius:6px;font-size:12px;display:none;z-index:100}
.anim-float{animation:afloat 3s ease-in-out infinite}
@keyframes afloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.anim-pulse{animation:apulse 2s ease-in-out infinite}
@keyframes apulse{0%,100%{opacity:1}50%{opacity:.5}}
.lb-table{width:100%;border-collapse:collapse;margin:8px 0;font-size:13px}
.lb-table td{padding:4px 8px;border-bottom:1px solid #1a1a4e}
.lb-table .rank{color:#ffd700;font-weight:bold;width:30px}
.lb-table .name{color:#00d2ff}.lb-table .sc{color:#fff;text-align:right}
</style>
</head>
<body>
<div id="toast"></div>

<!-- AUTH -->
<div id="auth-screen" class="screen active">
  <div class="neon-title anim-float">NEON RUNNER</div>
  <p class="sub">Online Multiplayer</p>
  <input id="auth-user" placeholder="Username" maxlength="20" autocomplete="off">
  <input id="auth-pass" type="password" placeholder="Password" maxlength="30">
  <div class="error" id="auth-error"></div>
  <div class="row">
    <button class="btn" onclick="doLogin()">Login</button>
    <button class="btn purple" onclick="doRegister()">Register</button>
  </div>
</div>

<!-- MAIN MENU -->
<div id="menu-screen" class="screen">
  <div class="neon-title" style="font-size:28px">NEON RUNNER</div>
  <p class="sub">Welcome, <span id="menu-user" style="color:#00d2ff"></span></p>
  <button class="btn wide" onclick="showScreen('lobby-screen');refreshRooms()">PLAY ONLINE</button>
  <button class="btn wide green" onclick="startSolo()">SOLO RUN</button>
  <button class="btn wide purple" onclick="showScreen('lb-screen');requestLB()">LEADERBOARD</button>
  <button class="btn wide" onclick="showScreen('settings-screen')" style="border-color:#888;color:#888">SETTINGS</button>
  <div class="sep"></div>
  <button class="btn sm red" onclick="logout()">Logout</button>
</div>

<!-- SETTINGS -->
<div id="settings-screen" class="screen">
  <h2>Settings</h2>
  <div class="settings-group">
    <label>Difficulty</label>
    <select id="set-diff">
      <option value="easy">Easy (slower)</option>
      <option value="normal" selected>Normal</option>
      <option value="hard">Hard (faster)</option>
    </select>
  </div>
  <div class="controls-hint">
    <b>Controls:</b><br>
    Jump: <b>SPACE</b> / <b>Click</b> / <b>Tap</b><br>
    Pause: <b>P</b> / pause button (top-right)<br>
    Back: <b>ESC</b>
  </div>
  <div class="sep"></div>
  <button class="btn wide" onclick="showScreen('menu-screen')">Back</button>
</div>

<!-- LOBBY -->
<div id="lobby-screen" class="screen">
  <h2>LOBBY</h2>
  <p class="sub">Create or join a room</p>
  <div class="row">
    <button class="btn" onclick="createRoom()">Create Room</button>
    <button class="btn sm" onclick="refreshRooms()">Refresh</button>
  </div>
  <div class="room-list" id="room-list"></div>
  <div class="sep"></div>
  <button class="btn wide red" onclick="showScreen('menu-screen')">Back to Menu</button>
</div>

<!-- LEADERBOARD -->
<div id="lb-screen" class="screen">
  <h2>LEADERBOARD</h2>
  <table class="lb-table" id="lb-table"></table>
  <div class="sep"></div>
  <button class="btn wide" onclick="showScreen('menu-screen')">Back</button>
</div>

<canvas id="c"></canvas>

<script>
// ═══════════════════════════════════════
// NETWORKING
// ═══════════════════════════════════════
const WS_URL=(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws';
let ws,myUsername='',myPlayerIndex=0,currentRoomId='',gameSeed=0,opponentName='';
function connectWS(){ws=new WebSocket(WS_URL);ws.onmessage=e=>handleMsg(JSON.parse(e.data));ws.onclose=()=>setTimeout(connectWS,2000);}
connectWS();
function send(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById(id);if(el)el.classList.add('active');
  canvas.style.display=id==='game-active'?'block':'none';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}

// Auth
function doLogin(){const u=document.getElementById('auth-user').value.trim(),p=document.getElementById('auth-pass').value;if(!u||!p)return;send({action:'login',username:u,password:p});}
function doRegister(){const u=document.getElementById('auth-user').value.trim(),p=document.getElementById('auth-pass').value;if(!u||!p)return;send({action:'register',username:u,password:p});}
function logout(){myUsername='';showScreen('auth-screen');}
document.getElementById('auth-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

// Lobby
function createRoom(){send({action:'create_room'});}
function refreshRooms(){send({action:'list_rooms'});}
function joinRoom(id){send({action:'join_room',room_id:id});}
function requestLB(){send({action:'get_leaderboard'});}
function leaveGame(){send({action:'leave_room'});currentRoomId='';onlineMode=false;soloMode=false;loopActive=false;showScreen('menu-screen');}
function renderRooms(arr){const el=document.getElementById('room-list');
  if(!arr.length){el.innerHTML='<p style="color:#444;padding:12px">No open rooms</p>';return;}
  el.innerHTML=arr.map(r=>`<div class="room-item"><div><span class="rid">${r.id}</span> — ${r.players.join(', ')}<span class="badge">${r.state}</span></div>${r.players.length<2&&!r.players.includes(myUsername)?`<button class="btn sm" onclick="joinRoom('${r.id}')">Join</button>`:''}</div>`).join('');}
function renderLB(entries){const el=document.getElementById('lb-table');
  if(!entries.length){el.innerHTML='<tr><td style="color:#444;padding:16px">No runs yet</td></tr>';return;}
  el.innerHTML=entries.map((e,i)=>`<tr><td class="rank">${i+1}</td><td class="name">${e.username}</td><td class="sc">${e.score}</td></tr>`).join('');}

// Message handler
let ghostData=null;
function handleMsg(msg){
  switch(msg.action){
    case 'error':document.getElementById('auth-error').textContent=msg.msg;toast(msg.msg);break;
    case 'registered':case 'logged_in':
      myUsername=msg.username;document.getElementById('menu-user').textContent=myUsername;
      showScreen('menu-screen');break;
    case 'room_list':renderRooms(msg.rooms);break;
    case 'game_start':
      gameSeed=msg.seed;myPlayerIndex=msg.player_index;currentRoomId=msg.room_id||currentRoomId;
      opponentName=msg.players.length>1?msg.players[1-myPlayerIndex]:'';
      startOnlineGame(msg.solo);break;
    case 'player_joined_midgame':
      opponentName=msg.username;toast(opponentName+' joined!');if(onlineMode)addP2();break;
    case 'opponent_jump':if(onlineMode)oppJumpQ.push(msg.frame);break;
    case 'opponent_died':if(onlineMode){const o=myPlayerIndex===0?p2:p1;if(o){o.alive=false;oppScore=msg.score;}if(allDead())gameOver=true;}break;
    case 'opponent_game_over':oppScore=msg.score;break;
    case 'opponent_left':toast((msg.username||'Opponent')+' left');if(onlineMode){const o=myPlayerIndex===0?p2:p1;if(o)o.alive=false;opponentName='';}break;
    case 'left_room':break;
    case 'ghost_data':ghostData=msg;break;
    case 'leaderboard':renderLB(msg.entries);break;
  }
}

// ═══════════════════════════════════════
// GAME ENGINE
// ═══════════════════════════════════════
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const GW=800,GH=420;
let sc=1,offX=0,offY=0;
function resize(){const w=window.innerWidth,h=window.innerHeight;sc=Math.min(w/GW,h/GH);
  canvas.width=GW*sc;canvas.height=GH*sc;offX=(w-canvas.width)/2;offY=(h-canvas.height)/2;
  canvas.style.marginLeft=offX+'px';canvas.style.marginTop=offY+'px';ctx.setTransform(sc,0,0,sc,0,0);}
resize();window.addEventListener('resize',resize);

// Audio
let audioCtx;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
function beep(f,d,t='square',v=.12){try{initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=t;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);
  o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d);}catch(e){}}
function sfxJump(){beep(440,.1,'sine',.1);}
function sfxCoin(){beep(800,.08,'sine',.15);beep(1200,.12,'sine',.1);}
function sfxDie(){beep(150,.25,'sawtooth',.12);}
function vib(ms){try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}}

// Constants — REDUCED SPEED
const GROUND_Y=350,GRAV=0.55,JUMP_F=-11.5,GROUND_H=70;
let BASE_SPD=3,SPD_INC=0.00015; // much slower than before

function getDiffSettings(){
  const d=document.getElementById('set-diff').value;
  if(d==='easy')return{bs:2.5,si:0.0001,jf:-11,g:0.5};
  if(d==='hard')return{bs:4,si:0.0003,jf:-12,g:0.6};
  return{bs:3,si:0.00015,jf:-11.5,g:0.55};
}

function seededRNG(s){return function(){s=(s*1664525+1013904223)&0xFFFFFFFF;return(s>>>0)/0xFFFFFFFF;};}
let rng;

// 5 Neon biomes
const BIOMES=[
  {name:'Neon City',sky1:'#0a0a2e',sky2:'#1a1050',ground:'#0d0d20',groundLine:'#00d2ff',
   mt1:'#0d0d28',mt2:'#151540',mt3:'#1a1a50',cloud:'rgba(0,210,255,.05)',
   obs:'#ff2e63',obsTop:'#ff6b8a',accent:'#00d2ff',
   obsNames:['neon_box','barrier','spike']},
  {name:'Sunset Strip',sky1:'#1a0a2e',sky2:'#4a1942',ground:'#1a0a1a',groundLine:'#ff8c00',
   mt1:'#200a20',mt2:'#301530',mt3:'#3a1a3a',cloud:'rgba(255,140,0,.06)',
   obs:'#ff6600',obsTop:'#ffaa44',accent:'#ff8c00',
   obsNames:['cone','drum','pillar']},
  {name:'Toxic Zone',sky1:'#050f05',sky2:'#0a2a0a',ground:'#060e06',groundLine:'#39ff14',
   mt1:'#081808',mt2:'#0c240c',mt3:'#103010',cloud:'rgba(57,255,20,.04)',
   obs:'#ff1493',obsTop:'#ff69b4',accent:'#39ff14',
   obsNames:['barrel','slime','pipe']},
  {name:'Ice Circuit',sky1:'#0a1525',sky2:'#152a45',ground:'#0a1520',groundLine:'#88ddff',
   mt1:'#0d1a30',mt2:'#152540',mt3:'#1a3050',cloud:'rgba(136,221,255,.06)',
   obs:'#00bfff',obsTop:'#66d9ff',accent:'#88ddff',
   obsNames:['icicle','block','crystal']},
  {name:'Lava Core',sky1:'#150000',sky2:'#2a0500',ground:'#1a0500',groundLine:'#ff4400',
   mt1:'#200800',mt2:'#2a0c00',mt3:'#351000',cloud:'rgba(255,68,0,.05)',
   obs:'#ffaa00',obsTop:'#ffcc44',accent:'#ff4400',
   obsNames:['fireball','rock','flame']},
];

let gameSpeed,frameCount,obstacles,coins,particles,dustP,stars;
let gameOver,started,onlineMode=false,soloMode=false,paused=false;
let curBiome,prevBiome,biomeT,nextBiomeAt;
let lastObsF,lastCoinF;
let bgLayers,clouds;
let p1,p2,oppScore=0,oppJumpQ=[];
let jumpRecord=[];
let loopActive=false;
let diff={bs:3,si:0.00015,jf:-11.5,g:0.55};

// Ghost
let ghost={x:60,y:GROUND_Y-38,vy:0,grounded:true},ghostIdx=0;

function createP(x,c,g){return{x,y:GROUND_Y-38,w:34,h:38,vy:0,grounded:true,rot:0,color:c,glow:g,score:0,alive:true,legA:0,blink:0};}
function addP2(){if(p2)return;p2=createP(45,'#7b2ff7','rgba(123,47,247,.3)');p2.y=GROUND_Y-p2.h;}

function genStars(){stars=[];for(let i=0;i<60;i++)stars.push({x:rng()*GW,y:rng()*300,r:rng()*1.2+.3,tw:rng()*Math.PI*2});}
function genMountains(){bgLayers=[];
  const r2=seededRNG(99);
  let f=[];for(let x=0;x<1100;x+=60+r2()*50)f.push({x,h:50+r2()*40,w:80+r2()*60});
  bgLayers.push({s:f,sp:.15,yo:0});
  let m=[];for(let x=0;x<1100;x+=40+r2()*40)m.push({x,h:30+r2()*30,w:50+r2()*40});
  bgLayers.push({s:m,sp:.35,yo:12});
  let n=[];for(let x=0;x<1100;x+=30+r2()*30)n.push({x,h:15+r2()*20,w:25+r2()*20});
  bgLayers.push({s:n,sp:.6,yo:25});
  clouds=[];for(let i=0;i<5;i++)clouds.push({x:r2()*900,y:20+r2()*80,w:50+r2()*70,h:10+r2()*12,sp:.08+r2()*.15});}

function pickBiome(ex){const c=BIOMES.filter(b=>b!==ex);return c[Math.floor(rng()*c.length)];}
function lerpHex(a,b,t){const ah=parseInt(a.slice(1),16),bh=parseInt(b.slice(1),16);
  const r=Math.round(((ah>>16)&0xff)+(((bh>>16)&0xff)-((ah>>16)&0xff))*t);
  const g=Math.round(((ah>>8)&0xff)+(((bh>>8)&0xff)-((ah>>8)&0xff))*t);
  const bl=Math.round((ah&0xff)+((bh&0xff)-(ah&0xff))*t);
  return`#${((r<<16)|(g<<8)|bl).toString(16).padStart(6,'0')}`;}
function bc(k){if(biomeT>0&&prevBiome&&prevBiome[k]&&curBiome[k]&&prevBiome[k][0]==='#')
  return lerpHex(prevBiome[k],curBiome[k],1-biomeT/80);return curBiome[k];}

const STAGE_DUR=800,OBS_GAP=100,COIN_GAP=120;

function initGame(seed){
  diff=getDiffSettings();
  rng=seededRNG(seed||Date.now());
  gameSpeed=diff.bs;frameCount=0;
  obstacles=[];coins=[];particles=[];dustP=[];
  gameOver=false;started=false;paused=false;
  lastObsF=-OBS_GAP;lastCoinF=-COIN_GAP;
  curBiome=BIOMES[0];prevBiome=null;biomeT=0;
  nextBiomeAt=STAGE_DUR+Math.floor(rng()*300);
  oppJumpQ=[];oppScore=0;jumpRecord=[];
  p1=createP(90,'#00d2ff','rgba(0,210,255,.3)');p1.y=GROUND_Y-p1.h;
  p2=null;
  ghost.y=GROUND_Y-38;ghost.vy=0;ghost.grounded=true;ghostIdx=0;
  genStars();genMountains();
  // Request ghost from server
  send({action:'get_ghost'});
}

function allDead(){if(!p1.alive){if(!p2)return true;return!p2.alive;}if(p2&&!p2.alive&&!p1.alive)return true;return false;}

// Input
function doJump(p){if(!p||!p.alive)return;if(!started)started=true;
  if(p.grounded){p.vy=diff.jf;p.grounded=false;sfxJump();
    for(let i=0;i<5;i++)dustP.push({x:p.x+p.w/2,y:GROUND_Y,vx:(Math.random()-.5)*2.5,vy:-Math.random()*2,
      r:1.5+Math.random()*1.5,life:12+Math.random()*8,ml:20,color:bc('groundLine')});}}

function handleInput(){
  if(gameOver){leaveGame();return;}
  if(paused){paused=false;return;}
  initAudio();
  if(onlineMode){const me=myPlayerIndex===0?p1:p2;if(me&&me.alive){doJump(me);
    if(me.grounded===false)send({action:'jump',frame:frameCount});jumpRecord.push(frameCount);}}
  else if(soloMode){doJump(p1);jumpRecord.push(frameCount);}}

document.addEventListener('keydown',e=>{
  if(canvas.style.display==='none')return;
  if(e.code==='Space'){e.preventDefault();handleInput();}
  if(e.code==='KeyP'&&started&&!gameOver){paused=!paused;}
  if(e.code==='Escape'){leaveGame();}});
canvas.addEventListener('click',e=>{
  const r=canvas.getBoundingClientRect(),cx=(e.clientX-r.left)/sc,cy=(e.clientY-r.top)/sc;
  if(started&&!gameOver&&!paused&&cx>GW-55&&cy<45){paused=true;return;}
  handleInput();});
canvas.addEventListener('touchstart',e=>{e.preventDefault();
  const t=e.touches[0],r=canvas.getBoundingClientRect(),cx=(t.clientX-r.left)/sc,cy=(t.clientY-r.top)/sc;
  if(started&&!gameOver&&!paused&&cx>GW-55&&cy<45){paused=true;return;}
  handleInput();},{passive:false});

// Spawn
function spawnObs(){
  const minG=frameCount<300?130:Math.max(60,OBS_GAP-Math.floor(frameCount/500)*3);
  if(frameCount-lastObsF<minG)return;if(rng()>0.025)return;
  const h=25+rng()*30,w=18+rng()*16;const type=curBiome.obsNames[Math.floor(rng()*3)];
  obstacles.push({x:GW+10,y:GROUND_Y-h,w,h,type,scored:[]});lastObsF=frameCount;}
function spawnCoin(){if(frameCount-lastCoinF<COIN_GAP)return;if(rng()>0.015)return;
  coins.push({x:GW+10,y:GROUND_Y-55-rng()*70,r:10,collected:false});lastCoinF=frameCount;}
function emitP(x,y,n,c){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-1)*5,
  r:1+Math.random()*3,life:18+Math.random()*18,ml:36,color:c||bc('obs')});}
function collides(a,b){const s=3;return a.x+s<b.x+b.w&&a.x+a.w-s>b.x&&a.y+s<b.y+b.h&&a.y+a.h-s>b.y;}

// Ghost update
function updateGhost(){
  if(!ghostData||!ghostData.jumps||ghostData.jumps.length===0)return;
  while(ghostIdx<ghostData.jumps.length&&ghostData.jumps[ghostIdx]<=frameCount){
    if(ghost.grounded){ghost.vy=diff.jf;ghost.grounded=false;}ghostIdx++;}
  ghost.vy+=diff.g;ghost.y+=ghost.vy;
  if(ghost.y>=GROUND_Y-38){ghost.y=GROUND_Y-38;ghost.vy=0;ghost.grounded=true;}}

// Update
function update(){
  if(!started||gameOver||paused)return;
  frameCount++;
  gameSpeed=diff.bs+frameCount*diff.si;

  if(biomeT>0)biomeT--;
  if(frameCount>=nextBiomeAt){prevBiome=curBiome;curBiome=pickBiome(curBiome);biomeT=80;
    nextBiomeAt=frameCount+STAGE_DUR+Math.floor(rng()*400);}

  // Opponent jumps
  if(onlineMode){const opp=myPlayerIndex===0?p2:p1;
    while(oppJumpQ.length>0){oppJumpQ.shift();if(opp&&opp.alive&&opp.grounded){opp.vy=diff.jf;opp.grounded=false;}}}

  const ps=[p1];if(p2)ps.push(p2);
  for(const p of ps){if(!p.alive)continue;p.vy+=diff.g;p.y+=p.vy;
    if(p.y>=GROUND_Y-p.h){p.y=GROUND_Y-p.h;p.vy=0;p.grounded=true;}
    if(!p.grounded)p.rot+=.06;else p.rot=0;p.legA+=.25;
    p.blink=(frameCount%200<4)?1:0;}

  // Running dust
  if(p1.alive&&p1.grounded&&frameCount%10===0)
    dustP.push({x:p1.x+5,y:GROUND_Y,vx:-1-Math.random(),vy:-Math.random(),r:1+Math.random(),life:8+Math.random()*6,ml:14,color:bc('ground')});

  updateGhost();

  spawnObs();
  const me=onlineMode?(myPlayerIndex===0?p1:p2):p1;
  for(let i=obstacles.length-1;i>=0;i--){const o=obstacles[i];o.x-=gameSpeed;
    for(const p of ps){if(p.alive&&!o.scored.includes(p)&&o.x+o.w<p.x){o.scored.push(p);p.score++;}}
    if(o.x+o.w<-20){obstacles.splice(i,1);continue;}
    for(const p of ps){if(p.alive&&collides(p,o)){p.alive=false;emitP(p.x+p.w/2,p.y+p.h/2,20,p.color);sfxDie();vib(80);
      if(onlineMode&&p===me){send({action:'player_died',score:me.score,frame:frameCount});
        send({action:'save_run',score:me.score,jumps:jumpRecord});}
      if(!onlineMode&&p===p1){send({action:'save_run',score:p1.score,jumps:jumpRecord});}
    }}}
  if(!ps.some(p=>p.alive))gameOver=true;

  spawnCoin();
  for(let i=coins.length-1;i>=0;i--){const c=coins[i];c.x-=gameSpeed;
    if(c.x<-20){coins.splice(i,1);continue;}
    if(!c.collected){for(const p of ps){if(p.alive){const dx=p.x+p.w/2-c.x,dy=p.y+p.h/2-c.y;
      if(Math.sqrt(dx*dx+dy*dy)<p.w/2+c.r){c.collected=true;p.score+=3;sfxCoin();emitP(c.x,c.y,8,'#ffd700');coins.splice(i,1);break;}}}}}

  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.life--;if(p.life<=0)particles.splice(i,1);}
  for(let i=dustP.length-1;i>=0;i--){const p=dustP[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)dustP.splice(i,1);}
  for(const l of bgLayers)for(const s of l.s){s.x-=gameSpeed*l.sp;if(s.x+s.w<-10)s.x+=1100+s.w;}
  for(const c of clouds){c.x-=gameSpeed*c.sp;if(c.x+c.w<-10){c.x=GW+10+Math.random()*80;c.y=20+Math.random()*80;}}
}

// ═══════════════════════════════════════
// DRAWING (NEON STYLE)
// ═══════════════════════════════════════
function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,GH);g.addColorStop(0,bc('sky1'));g.addColorStop(1,bc('sky2'));
  ctx.fillStyle=g;ctx.fillRect(0,0,GW,GH);
  // Stars
  for(const s of stars){s.tw+=.015;ctx.fillStyle=`rgba(255,255,255,${.3+Math.sin(s.tw)*.25})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();}
  // Clouds
  ctx.fillStyle=bc('cloud')||'rgba(255,255,255,.03)';
  for(const c of clouds){ctx.beginPath();ctx.ellipse(c.x+c.w/2,c.y+c.h/2,c.w/2,c.h/2,0,0,Math.PI*2);ctx.fill();}}
function drawMts(){const keys=['mt1','mt2','mt3'];
  for(let i=0;i<bgLayers.length;i++){ctx.fillStyle=bc(keys[i]);
    for(const s of bgLayers[i].s){ctx.beginPath();ctx.moveTo(s.x,GROUND_Y-bgLayers[i].yo);
      ctx.lineTo(s.x+s.w/2,GROUND_Y-bgLayers[i].yo-s.h);ctx.lineTo(s.x+s.w,GROUND_Y-bgLayers[i].yo);ctx.closePath();ctx.fill();}}}
function drawGround(){
  ctx.fillStyle=bc('ground');ctx.fillRect(0,GROUND_Y,GW,GROUND_H);
  const gl=bc('groundLine');
  ctx.strokeStyle=gl;ctx.lineWidth=2;ctx.shadowColor=gl;ctx.shadowBlur=12;
  ctx.beginPath();ctx.moveTo(0,GROUND_Y);ctx.lineTo(GW,GROUND_Y);ctx.stroke();ctx.shadowBlur=0;
  // Neon grid on ground
  ctx.globalAlpha=.15;ctx.strokeStyle=gl;ctx.lineWidth=.5;
  const d=started?(frameCount*gameSpeed*1.2)%30:0;
  for(let x=-d;x<GW;x+=30){ctx.beginPath();ctx.moveTo(x,GROUND_Y+1);ctx.lineTo(x,GROUND_Y+GROUND_H);ctx.stroke();}
  for(let y=GROUND_Y+15;y<GROUND_Y+GROUND_H;y+=15){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(GW,y);ctx.stroke();}
  ctx.globalAlpha=1;}

function drawChar(x,y,w,h,color,rot,legA,blink,alpha){
  ctx.save();ctx.globalAlpha=alpha||1;const cx=x+w/2,cy=y+h/2;ctx.translate(cx,cy);ctx.rotate(rot||0);
  // Neon glow
  ctx.shadowColor=color;ctx.shadowBlur=15;
  // Legs
  const lo=Math.sin(legA||0)*3;ctx.fillStyle=color;
  ctx.fillRect(-7,h/2-2,5,7+lo);ctx.fillRect(2,h/2-2,5,7-lo);
  // Body
  const r=4,hw=w/2,hh=h/2-2;ctx.beginPath();
  ctx.moveTo(-hw+r,-hh);ctx.lineTo(hw-r,-hh);ctx.quadraticCurveTo(hw,-hh,hw,-hh+r);
  ctx.lineTo(hw,hh-r);ctx.quadraticCurveTo(hw,hh,hw-r,hh);ctx.lineTo(-hw+r,hh);
  ctx.quadraticCurveTo(-hw,hh,-hw,hh-r);ctx.lineTo(-hw,-hh+r);ctx.quadraticCurveTo(-hw,-hh,-hw+r,-hh);
  ctx.closePath();ctx.fill();
  ctx.shadowBlur=0;
  // Eye
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(5,-5,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(6,-5,blink?.4:2.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // Name
  ctx.fillStyle=color;ctx.font='9px sans-serif';ctx.textAlign='center';
  let nm='';if(onlineMode){
    if((x===p1.x&&myPlayerIndex===0)||(p2&&x===p2.x&&myPlayerIndex===1))nm=myUsername;
    else if(opponentName)nm=opponentName;
  }else{nm=x===90?myUsername||'You':'';}
  if(nm){ctx.globalAlpha=(alpha||1)*.8;ctx.fillText(nm,x+w/2,y-6);ctx.globalAlpha=1;}}

function drawGhost(){
  if(!ghostData||!ghostData.jumps||ghostData.jumps.length===0)return;
  ctx.save();ctx.globalAlpha=.25;
  const gx=60,gy=ghost.y,gw=32,gh=36;
  ctx.fillStyle='#aaa';ctx.shadowColor='#fff';ctx.shadowBlur=8;
  ctx.fillRect(gx,gy,gw,gh);ctx.shadowBlur=0;
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='8px sans-serif';ctx.textAlign='center';
  ctx.fillText(ghostData.username||'Ghost',gx+gw/2,gy-4);
  ctx.restore();}

function drawObs(){for(const o of obstacles){
  ctx.fillStyle=bc('obs');ctx.shadowColor=bc('obs');ctx.shadowBlur=8;
  if(o.type&&o.type.includes('spike')){ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.closePath();ctx.fill();}
  else if(o.type&&o.type.includes('pipe')){ctx.fillRect(o.x+o.w/2-4,o.y,8,o.h);ctx.fillRect(o.x,o.y,o.w,5);}
  else{ctx.fillRect(o.x,o.y,o.w,o.h);ctx.fillStyle=bc('obsTop');ctx.fillRect(o.x-1,o.y,o.w+2,3);}
  ctx.shadowBlur=0;}}
function drawCoins(){const bob=Math.sin(frameCount*.07)*3;
  for(const c of coins){if(c.collected)continue;ctx.save();ctx.translate(c.x,c.y+bob);
    ctx.fillStyle='#ffd700';ctx.shadowColor='rgba(255,215,0,.4)';ctx.shadowBlur=10;
    ctx.beginPath();ctx.arc(0,0,c.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
    ctx.strokeStyle='#b8960a';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(0,0,c.r-3,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#b8960a';ctx.font='bold 9px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('$',0,1);ctx.restore();}}
function drawParticles(){
  for(const p of particles){ctx.globalAlpha=p.life/p.ml;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  for(const p of dustP){ctx.globalAlpha=p.life/p.ml*.4;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
  ctx.globalAlpha=1;}

function drawHUD(){
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='bold 18px "Segoe UI",sans-serif';
  if(onlineMode){const me=myPlayerIndex===0?p1:p2,opp=myPlayerIndex===0?p2:p1;
    ctx.fillStyle=me?me.color:'#fff';ctx.fillText(`You: ${me?me.score:0}`,14,24);
    if(me&&!me.alive){ctx.fillStyle='#ff2e63';ctx.font='10px sans-serif';ctx.fillText('DEAD',14,38);}
    if(opp){ctx.fillStyle=opp.color;ctx.font='bold 18px "Segoe UI",sans-serif';ctx.fillText(`${opponentName||'P2'}: ${opp.alive?opp.score:oppScore}`,140,24);
      if(!opp.alive){ctx.fillStyle='#ff2e63';ctx.font='10px sans-serif';ctx.fillText('DEAD',140,38);}}
    else{ctx.fillStyle='#444';ctx.font='11px sans-serif';ctx.fillText('Waiting for P2...',140,24);}
  }else{ctx.fillText(`Score: ${p1.score}`,14,24);}
  ctx.textAlign='right';ctx.font='11px sans-serif';ctx.fillStyle=bc('accent');
  ctx.fillText(`${curBiome.name}`,GW-14,24);
  ctx.fillStyle='#555';ctx.font='9px sans-serif';ctx.fillText(`Speed: ${gameSpeed.toFixed(1)}`,GW-14,38);
  // Pause btn
  ctx.fillStyle='rgba(255,255,255,.08)';ctx.fillRect(GW-50,6,42,32);
  ctx.fillStyle='#fff';ctx.font='bold 16px sans-serif';ctx.textAlign='center';ctx.fillText('||',GW-29,28);
  // Ghost indicator
  if(ghostData&&ghostData.username){ctx.fillStyle='#39ff14';ctx.font='8px sans-serif';ctx.textAlign='right';
    ctx.fillText('GHOST: '+ghostData.username+' ('+ghostData.score+')',GW-14,GH-6);}}

function drawReady(){ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,GW,GH);
  ctx.fillStyle='#00d2ff';ctx.font='bold 32px "Segoe UI",sans-serif';ctx.textAlign='center';
  ctx.shadowColor='rgba(0,210,255,.4)';ctx.shadowBlur=20;
  ctx.fillText('READY?',GW/2,GH/2-15);ctx.shadowBlur=0;
  ctx.fillStyle='#888';ctx.font='16px sans-serif';ctx.fillText('Tap / SPACE to start',GW/2,GH/2+15);
  ctx.fillStyle='#444';ctx.font='11px sans-serif';ctx.fillText('ESC = menu',GW/2,GH/2+40);}

function drawGameOver(){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,GW,GH);
  ctx.fillStyle='#ff2e63';ctx.font='bold 38px "Segoe UI",sans-serif';ctx.textAlign='center';
  ctx.shadowColor='rgba(255,46,99,.3)';ctx.shadowBlur=20;
  ctx.fillText('GAME OVER',GW/2,GH/2-50);ctx.shadowBlur=0;
  if(onlineMode){const me=myPlayerIndex===0?p1:p2,opp=myPlayerIndex===0?p2:p1;
    const ms=me?me.score:0,os=opp?(opp.alive?opp.score:oppScore):0;
    ctx.font='20px sans-serif';ctx.fillStyle=me?me.color:'#fff';ctx.fillText(`You: ${ms}`,GW/2,GH/2-15);
    if(opp){ctx.fillStyle=opp.color;ctx.fillText(`${opponentName}: ${os}`,GW/2,GH/2+10);
      ctx.font='bold 16px sans-serif';
      if(ms>os){ctx.fillStyle='#39ff14';ctx.fillText('YOU WIN!',GW/2,GH/2+35);}
      else if(ms<os){ctx.fillStyle='#ff2e63';ctx.fillText('YOU LOSE',GW/2,GH/2+35);}
      else{ctx.fillStyle='#ffd700';ctx.fillText('TIE!',GW/2,GH/2+35);}}
  }else{ctx.font='20px sans-serif';ctx.fillStyle='#fff';ctx.fillText(`Score: ${p1.score}`,GW/2,GH/2-10);}
  // Neon button
  const bw=200,bh=38,bx=GW/2-bw/2,by=GH/2+55;
  ctx.strokeStyle='#00d2ff';ctx.lineWidth=2;ctx.shadowColor='rgba(0,210,255,.4)';ctx.shadowBlur=10;
  ctx.beginPath();ctx.roundRect(bx,by,bw,bh,6);ctx.stroke();ctx.shadowBlur=0;
  ctx.fillStyle='#00d2ff';ctx.font='bold 15px "Segoe UI",sans-serif';ctx.fillText('BACK TO MENU',GW/2,by+bh/2+5);}

function drawPaused(){ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(0,0,GW,GH);
  ctx.fillStyle='#ffd700';ctx.font='bold 34px "Segoe UI",sans-serif';ctx.textAlign='center';
  ctx.shadowColor='rgba(255,215,0,.3)';ctx.shadowBlur=15;
  ctx.fillText('PAUSED',GW/2,GH/2-10);ctx.shadowBlur=0;
  ctx.fillStyle='#888';ctx.font='15px sans-serif';ctx.fillText('Tap or P to resume',GW/2,GH/2+20);}

// Loop
function loop(){if(!loopActive)return;if(document.hidden){requestAnimationFrame(loop);return;}
  update();drawBg();drawMts();drawGround();drawObs();drawCoins();
  drawGhost();
  if(p2){drawChar(p2.x,p2.y,p2.w,p2.h,p2.color,p2.rot,p2.legA,p2.blink,p2.alive?1:.2);}
  drawChar(p1.x,p1.y,p1.w,p1.h,p1.color,p1.rot,p1.legA,p1.blink,p1.alive?1:.2);
  drawParticles();
  if(started&&!gameOver&&!paused)drawHUD();
  if(!started)drawReady();
  if(paused)drawPaused();
  if(gameOver){drawHUD();drawGameOver();}
  requestAnimationFrame(loop);}

function startOnlineGame(solo){onlineMode=true;soloMode=false;
  showScreen('game-active');canvas.style.display='block';
  initGame(gameSeed);if(!solo)addP2();loopActive=true;loop();}
function startSolo(){onlineMode=false;soloMode=true;
  showScreen('game-active');canvas.style.display='block';
  initGame(Date.now());loopActive=true;loop();}
</script>
